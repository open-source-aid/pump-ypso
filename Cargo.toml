[package]
name = "pump-ypso"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Sans-IO YpsoPump protocol: framing, XChaCha20-Poly1305 sealing, UUIDs, opcodes and counter policy"
license = "AGPL-3.0-or-later"
repository = "https://github.com/u-osaid/pump-yspo"
keywords = ["insulin", "pump", "ble", "sans-io", "no-std"]
categories = ["no-std", "embedded"]

[features]
default = ["std"]
std = ["pump-shared/std"]
sim = ["std", "dep:pump-testkit"]
opn = []

[dependencies]
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
libm = "0.2"
pump-shared = { git = "https://github.com/u-osaid/pump-shared", branch = "main", default-features = false }
pump-testkit = { git = "https://github.com/u-osaid/pump-testkit", branch = "main", optional = true }
