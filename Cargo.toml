[package]
name = "pump-ypso"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Sans-IO YpsoPump protocol: framing, XChaCha20-Poly1305 sealing, UUIDs, opcodes and counter policy"
license = "AGPL-3.0-or-later"
repository = "https://github.com/open-source-aid/pump-ypso"
keywords = ["insulin", "pump", "ble", "sans-io", "no-std"]
categories = ["no-std", "embedded"]

[features]
default = ["std"]
std = ["pump-shared/std"]
sim = ["pump-shared/sim", "dep:chacha20", "dep:curve25519-dalek"]
opn = []
delivery = []

[dependencies]
chacha20 = { version = "0.9", default-features = false, optional = true }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
curve25519-dalek = { version = "4.1", default-features = false, optional = true }
libm = "0.2"
pump-shared = { git = "https://github.com/open-source-aid/pump-shared", branch = "main", default-features = false }

# Local development override. `Action::PublicKey` / `Completion::PublicKey` and
# the `API_VERSION` bump to 2 are a pump-shared change that has not been pushed
# yet, so until it lands on that repository's `main` this points the dependency
# at the sibling checkout. Delete this section the moment it does: nothing else
# here depends on the layout of the developer's disk.
[patch."https://github.com/open-source-aid/pump-shared"]
pump-shared = { path = "../pump-shared" }

# Same, for the tester harness: it is a host, so the new exhaustive `Action`
# variant makes it handle one more case. Delete this section once that change
# lands on the tester repository's `main`.
[patch."https://github.com/open-source-aid/tester"]
tester-harness = { path = "../tester/crates/harness" }

[dev-dependencies]
tester-harness = { git = "https://github.com/open-source-aid/tester", branch = "main" }
