[package]
name = "pump-ypso"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Sans-IO YpsoPump protocol: framing, XChaCha20-Poly1305 sealing, UUIDs, opcodes and counter policy"
license = "AGPL-3.0-or-later"
repository = "https://github.com/open-source-aid/pump-ypso"
keywords = ["insulin", "pump", "ble", "sans-io", "no-std"]
categories = ["no-std", "embedded"]

[features]
default = ["std"]
std = ["pump-shared/std"]
sim = ["pump-shared/sim", "dep:curve25519-dalek"]
opn = []
delivery = []
# Emit the raw protocol state bytes (system/bolus status byte 0) as debug logs.
# Off by default: a diagnostic for pinning down an unknown device-state value
# against hardware, not something to run on every status read in production.
diag = []

[dependencies]
chacha20 = { version = "0.9", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
md-5 = { version = "0.10", default-features = false }
curve25519-dalek = { version = "4.1", default-features = false, optional = true }
libm = "0.2"
pump-shared = { git = "https://github.com/open-source-aid/pump-shared", branch = "main", default-features = false }

[dev-dependencies]
tester-harness = { git = "https://github.com/open-source-aid/tester", branch = "main" }
